databases:
  - name: icdd-db
    plan: free
    databaseName: icdd
    user: icdd

services:
  - type: web
    name: icdd-dashboard
    plan: free
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn ICDD.wsgi:application --bind 0.0.0.0:$PORT --workers 3'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icdd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
      - key: WEB_CONCURRENCY
        value: 3